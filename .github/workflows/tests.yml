name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Confirm the runtime dependency tree is empty
        # The project's central claim is that it needs nothing but the
        # standard library. Assert it rather than trusting it: pip install is
        # never run, so anything imported must already be in the stdlib.
        run: |
          python -c "import catalog_audit, catalog_audit.agent, catalog_audit.cli"
          test ! -f requirements.txt || (echo "requirements.txt appeared" && exit 1)
          test ! -f pyproject.toml   || (echo "pyproject.toml appeared" && exit 1)
          test ! -f setup.py         || (echo "setup.py appeared" && exit 1)
          test ! -f Pipfile          || (echo "Pipfile appeared" && exit 1)
          test ! -f poetry.lock      || (echo "poetry.lock appeared" && exit 1)

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Confirm no secret was committed
        run: |
          ! git ls-files | grep -Ei '^\.env$|\.key$'
          # The API evidence file is committed on purpose as a submission
          # artefact. Assert it never starts carrying a credential.
          if [ -f out/api_evidence.json ]; then
            ! grep -qiE '"(authorization|api_key|hs_api_key)":[[:space:]]*"[A-Za-z0-9_-]{16,}' \
                out/api_evidence.json
            grep -q 'redacted' out/api_evidence.json
          fi

  quality:
    name: lint, security and complexity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install analysis tools
        # Development tooling only. None of this is imported at runtime, and
        # the job above proves the runtime tree is still empty.
        run: pip install --disable-pip-version-check ruff bandit radon coverage

      - name: Lint
        run: ruff check catalog_audit scripts tests

      - name: Security scan
        # Any finding at all fails the build. The one reviewed false positive
        # carries an inline nosec with its justification.
        run: bandit -r catalog_audit scripts -ll -q

      - name: Refuse cyclomatic complexity of D or worse
        run: |
          radon cc catalog_audit scripts -n D --total-average
          test -z "$(radon cc catalog_audit scripts -n D -s | grep -E '^\s+[FCM] ')" \
            || (echo "A function scored D or worse. Split it." && exit 1)

      - name: Report maintainability
        run: radon mi catalog_audit scripts -s

      - name: Test coverage
        run: |
          coverage run --source=catalog_audit -m unittest discover -s tests
          coverage report --show-missing --fail-under=85

      - name: Confirm the SBOM still claims an empty runtime tree
        run: |
          python - <<'PY'
          import json, pathlib
          bom = json.loads(pathlib.Path("sbom.json").read_text())
          assert bom["components"] == [], "sbom.json lists runtime components"
          assert bom["dependencies"][0]["dependsOn"] == [], "sbom.json lists deps"
          print("SBOM: 0 runtime components, as claimed")
          PY
