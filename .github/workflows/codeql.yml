name: codeql

# An independent scan on a cadence, rather than only when someone remembers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 07:00 UTC.
    - cron: "0 7 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
